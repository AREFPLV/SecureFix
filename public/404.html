<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | SecureFix</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2d2d2d;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        text-align: center;
        padding: 48px 24px;
        max-width: 34rem;
      }
      img {
        width: 84px;
        height: auto;
      }
      p.kicker {
        margin: 28px 0 0;
        color: #fbaf00;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 8px 0 12px;
        font-size: 2.4rem;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #b0b0b0;
        line-height: 1.6;
      }
      a.home {
        display: inline-block;
        margin-top: 28px;
        background: #fbaf00;
        color: #2d2d2d;
        text-decoration: none;
        font-weight: 700;
        padding: 12px 22px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/"><img src="/logo.png" alt="SecureFix" /></a>
      <p class="kicker">404</p>
      <h1>Page not found</h1>
      <p>That address is not on SecureFix.</p>
      <a class="home" href="/">Back to home</a>
    </main>
  </body>
</html>
